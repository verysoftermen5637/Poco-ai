[package]
name = "poco_sd_bridge"
version = "1.0.0"
edition = "2021"
description = "Dedicated Rust JNI bridge to stable-diffusion.cpp (isolated cdylib to prevent ggml symbol conflicts)"

[lib]
name = "poco_sd_bridge"
crate-type = ["cdylib"]

[dependencies]
jni = "0.21"
libc = "0.2"
once_cell = "1.20"
parking_lot = "0.12"
png = "0.17"

[build-dependencies]
cc = "1.2"
