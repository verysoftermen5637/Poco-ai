[package]
name = "poco_ai_core"
version = "1.0.0"
edition = "2021"
description = "Native Rust JNI core for POCO X8 Pro Max AI Studio (llama.cpp + Candle MusicGen + Dimensity 9500s CPU pinning)"

[lib]
name = "poco_ai_core"
crate-type = ["cdylib"]

[dependencies]
jni = "0.21"
libc = "0.2"
once_cell = "1.20"
parking_lot = "0.12"
anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
encoding_rs = "0.8"
rand = "0.8"
hound = "3.5"

# LLM Engine: llama.cpp Rust bindings (pinned 0.1.154: supports GGML_ env forwarding & GGML_CPU_ARM_ARCH on Android)
llama-cpp-2 = { version = "=0.1.154", default-features = false }

# Audio Engine: Native Rust Candle framework (CPU-only, pure-Rust fancy-regex tokenizer for Android cross-compile)
candle-core = "0.9.2"
candle-nn = "0.9.2"
candle-transformers = "0.9.2"
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14"
log = "0.4"
