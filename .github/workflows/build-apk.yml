name: Build POCO X8 Pro Max AI Studio APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_NDK_VERSION: "28.0.13004108"
  ANDROID_API_LEVEL: "29"
  SD_CPP_COMMIT: "532d2c1"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install native build dependencies (clang, libclang, cmake, ninja)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang \
            libclang-dev \
            cmake \
            ninja-build \
            pkg-config \
            git

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK & NDK r28
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android 16 (API 36) Platform, Build-Tools & NDK r28
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Set up Rust (aarch64-linux-android)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk (prebuilt binary)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Cache Cargo registry & build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-arm64-${{ hashFiles('rust/**/Cargo.toml', '.cargo/config.toml') }}

      - name: Clone & build stable-diffusion.cpp (CPU-only, KleidiAI, ARMv9.2 SIMD)
        run: |
          mkdir -p third_party
          git clone --recursive https://github.com/leejet/stable-diffusion.cpp.git third_party/stable-diffusion.cpp
          cd third_party/stable-diffusion.cpp
          git checkout "${SD_CPP_COMMIT}" || true
          git submodule update --init --recursive

          cmake -B build-android-arm64 -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="${ANDROID_NDK_HOME}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-${ANDROID_API_LEVEL} \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DSD_BUILD_EXAMPLES=OFF \
            -DSD_VULKAN=OFF \
            -DSD_OPENCL=OFF \
            -DSD_CUDA=OFF \
            -DSD_METAL=OFF \
            -DGGML_CPU_KLEIDIAI=ON \
            -DGGML_CPU_ARM_ARCH="armv8.2-a+dotprod+i8mm+fp16" \
            -DGGML_NATIVE=OFF \
            -DGGML_VULKAN=OFF \
            -DGGML_OPENCL=OFF \
            -DCMAKE_C_FLAGS="-O3 -march=armv8.2-a+dotprod+i8mm+fp16 -fvisibility=hidden" \
            -DCMAKE_CXX_FLAGS="-O3 -march=armv8.2-a+dotprod+i8mm+fp16 -fvisibility=hidden" \
            -DCMAKE_SHARED_LINKER_FLAGS="-Wl,-z,max-page-size=16384"

          cmake --build build-android-arm64 --target stable-diffusion -j "$(nproc)"

      - name: Build Rust JNI libraries (libpoco_ai_core.so & libpoco_sd_bridge.so)
        env:
          CMAKE_TOOLCHAIN_FILE: "${{ env.ANDROID_NDK_HOME }}/build/cmake/android.toolchain.cmake"
          ANDROID_ABI: "arm64-v8a"
          ANDROID_PLATFORM: "android-29"
          GGML_CPU_KLEIDIAI: "ON"
          GGML_CPU_ARM_ARCH: "armv8.2-a+dotprod+i8mm+fp16"
          GGML_NATIVE: "OFF"
          GGML_VULKAN: "OFF"
          GGML_OPENCL: "OFF"
          GGML_CUDA: "OFF"
          GGML_METAL: "OFF"
          BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android: "--sysroot=${{ env.ANDROID_NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          SD_CPP_DIR: "${{ github.workspace }}/third_party/stable-diffusion.cpp"
          SD_CPP_BUILD_DIR: "${{ github.workspace }}/third_party/stable-diffusion.cpp/build-android-arm64"
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cd rust
          cargo ndk \
            -t arm64-v8a \
            --platform "${ANDROID_API_LEVEL}" \
            -o ../app/src/main/jniLibs \
            build --release

          # Bundle NDK libc++_shared.so required by llama.cpp and stable-diffusion.cpp
          cp "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" \
            ../app/src/main/jniLibs/arm64-v8a/

          ls -lh ../app/src/main/jniLibs/arm64-v8a/

      - name: Verify 16 KB ELF page alignment on all native .so libraries
        run: |
          READELF="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          for so in app/src/main/jniLibs/arm64-v8a/*.so; do
            echo "=== Checking $so ==="
            "${READELF}" -l "$so" | grep -E "LOAD|Align" || true
          done

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug-signed release APK (app-release.apk)
        run: |
          gradle assembleRelease --no-daemon --stacktrace
          ls -lh app/build/outputs/apk/release/app-release.apk

      - name: Upload POCO-X8-Pro-Max-AI-Studio APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: POCO-X8-Pro-Max-AI-Studio
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
